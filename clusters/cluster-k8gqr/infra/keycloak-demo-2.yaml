apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
    name: keycloak-demo-2
    namespace: flux-system
spec:
    interval: 1m
    ref:
        branch: master
    url: ssh://github.com/enschede/KeycloakDemo2.git
    secretRef:
        name: github-deploy-key-keycloak-demo-2

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: keycloak-demo-2
    namespace: flux-system
spec:
    interval: 1m
    path: ./apps/test/keycloak
    prune: true
    sourceRef:
        kind: GitRepository
        name: keycloak-demo-2
        namespace: flux-system
    wait: true
    decryption:
        provider: sops
        secretRef:
            name: sops-age
    healthChecks:
        - apiVersion: apps/v1
          kind: Deployment
          name: keycloak
          namespace: keycloak
